name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      PACKAGES: packages/core packages/node packages/bun packages/cloudflare packages/tanstack-start
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - name: Check trusted publishers
        run: |
          id_token=$(curl -fsS \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -re .value)
          unmatched=
          for package in $PACKAGES
          do
            name=$(node -p "require('./$package/package.json').name")
            status=$(curl -sS -o "$RUNNER_TEMP/exchange.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $id_token" \
              "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${name/\//%2f}")
            case $status in
              2*)
                echo "$name: trusted publisher matches this workflow"
                ;;
              *)
                echo "$name: $status $(jq -r .message "$RUNNER_TEMP/exchange.json")"
                unmatched="$unmatched $name"
                ;;
            esac
          done
          if [ -n "$unmatched" ]; then
            echo "::error::No npm trusted publisher accepts this workflow for:$unmatched"
            echo "Add one per package on npmjs.com (GitHub Actions, supainc, supacatch-js, release.yml, environment npm, allowing npm publish). 'package not found' means no publisher matched, not a missing package."
            exit 1
          fi
      - name: Publish packages
        run: |
          for package in $PACKAGES
          do
            name=$(node -p "require('./$package/package.json').name")
            version=$(node -p "require('./$package/package.json').version")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already published"
            else
              npm publish "./$package" --provenance --access public --tag alpha --loglevel verbose
            fi
          done
