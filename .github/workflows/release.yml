name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: npm publish ./packages/core --provenance --access public --tag alpha
      - run: npm publish ./packages/node --provenance --access public --tag alpha
      - run: npm publish ./packages/bun --provenance --access public --tag alpha
      - run: npm publish ./packages/deno --provenance --access public --tag alpha
      - run: npm publish ./packages/cloudflare --provenance --access public --tag alpha
      - run: npm publish ./packages/tanstack-start --provenance --access public --tag alpha
